name: Deploy Preview (branch subpath)

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/board-perspective-2_5d-a5c5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (production base)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build production Hex Game
        run: |
          npm install
          npm run build

      - name: Install and build Story Architecture Studio
        if: hashFiles('story-architecture-studio/package.json') != ''
        working-directory: story-architecture-studio
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
        env:
          BASE_PATH: /TestGame/studio/

      - name: Combine studio into production dist
        if: hashFiles('story-architecture-studio/package.json') != ''
        run: |
          mkdir -p dist/studio
          cp -r story-architecture-studio/dist/* dist/studio/

      - name: Checkout preview branch sources
        uses: actions/checkout@v4
        with:
          ref: cursor/board-perspective-2_5d-a5c5
          path: preview-src

      - name: Build preview Hex Game at subpath
        working-directory: preview-src
        run: |
          npm install
          npx vite build --base /TestGame/preview/2_5d/

      - name: Add preview build to site artifact
        run: |
          mkdir -p dist/preview/2_5d
          cp -r preview-src/dist/* dist/preview/2_5d/
          cp preview-src/dist/index.html dist/preview/2_5d/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/2_5d/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
