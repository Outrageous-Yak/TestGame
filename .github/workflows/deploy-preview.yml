# Preview deploys run via main branch deploy.yml + .github/preview-deploy.json
# (feature-branch pushes cannot satisfy github-pages environment protection).
name: Deploy Preview (manual)

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Push to main with updated preview-deploy.json triggered_at instead'
        required: false
        default: 'use-main-deploy'

permissions:
  contents: read

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Use main deploy path
        run: |
          echo "Preview is deployed by .github/workflows/deploy.yml on main."
          echo "Update .github/preview-deploy.json triggered_at on main and push."
          echo "Preview URL: https://outrageous-yak.github.io/TestGame/preview/2_5d/"
