# Deploy a feature branch to a subpath on GitHub Pages (no merge to main).
# Trigger: push `.github/preview-deploy.json` on main, or Actions → Run workflow.
name: Deploy Preview (branch subpath)

on:
  workflow_dispatch:
    inputs:
      preview_branch:
        description: 'Branch to build and deploy under /preview/<slug>/'
        required: true
        default: 'cursor/board-perspective-2_5d-a5c5'
        type: string
      preview_slug:
        description: 'URL slug (https://…/TestGame/preview/<slug>/)'
        required: true
        default: '2_5d'
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/preview-deploy.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (production bundle)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve preview target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=${{ inputs.preview_branch }}" >> "$GITHUB_OUTPUT"
            echo "slug=${{ inputs.preview_slug }}" >> "$GITHUB_OUTPUT"
          else
            BRANCH=$(jq -r '.preview_branch' .github/preview-deploy.json)
            SLUG=$(jq -r '.preview_slug' .github/preview-deploy.json)
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
            echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build production
        run: |
          npm ci
          npm run build

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          path: preview-src

      - name: Build preview at subpath
        working-directory: preview-src
        run: |
          npm ci
          npm run build -- --base /TestGame/preview/${{ steps.target.outputs.slug }}/

      - name: Merge site bundles
        run: |
          mkdir -p dist/preview/${{ steps.target.outputs.slug }}
          cp -r preview-src/dist/* dist/preview/${{ steps.target.outputs.slug }}/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
