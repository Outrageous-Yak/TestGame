name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build Hex Game
        run: |
          npm install
          npm run build

      - name: Read preview deploy config
        if: hashFiles('.github/preview-deploy.json') != ''
        id: preview_config
        run: |
          echo "branch=$(jq -r '.preview_branch' .github/preview-deploy.json)" >> "$GITHUB_OUTPUT"
          echo "slug=$(jq -r '.preview_slug' .github/preview-deploy.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout preview branch
        if: hashFiles('.github/preview-deploy.json') != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.preview_config.outputs.branch }}
          path: preview-src

      - name: Build preview at subpath
        if: hashFiles('.github/preview-deploy.json') != ''
        working-directory: preview-src
        run: |
          npm install
          npm run build -- --base /TestGame/preview/${{ steps.preview_config.outputs.slug }}/

      - name: Merge preview into site bundle
        if: hashFiles('.github/preview-deploy.json') != ''
        run: |
          mkdir -p dist/preview/${{ steps.preview_config.outputs.slug }}
          cp -r preview-src/dist/* dist/preview/${{ steps.preview_config.outputs.slug }}/
          cp preview-src/dist/index.html dist/preview/${{ steps.preview_config.outputs.slug }}/404.html

      - name: Install and build Story Architecture Studio
        if: hashFiles('story-architecture-studio/package.json') != ''
        working-directory: story-architecture-studio
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
        env:
          BASE_PATH: /TestGame/studio/

      - name: Combine site artifacts
        if: hashFiles('story-architecture-studio/package.json') != ''
        run: |
          mkdir -p dist/studio
          cp -r story-architecture-studio/dist/* dist/studio/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
