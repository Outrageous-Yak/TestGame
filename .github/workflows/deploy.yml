name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build Hex Game
        run: |
          npm install
          npm run build

      - name: Install and build Story Architecture Studio
        if: hashFiles('story-architecture-studio/package.json') != ''
        working-directory: story-architecture-studio
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
        env:
          BASE_PATH: /TestGame/studio/

      - name: Combine site artifacts
        if: hashFiles('story-architecture-studio/package.json') != ''
        run: |
          mkdir -p dist/studio
          cp -r story-architecture-studio/dist/* dist/studio/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
