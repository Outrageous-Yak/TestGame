name: Publish to GitHub Pages

# Primary deploy path: runs on each push to main (replaces deploy.yml push trigger).

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Fallback when push-triggered runs are wedged in the Actions queue.
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write
  actions: write

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Clear wedged legacy deploy runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          for run_id in 31124812384 31122319176; do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null)
            if [ "$state" = "queued" ] || [ "$state" = "pending" ] || [ "$state" = "in_progress" ]; then
              echo "Force-canceling wedged run ${run_id} (was ${state})"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" 2>/dev/null || true
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" 2>/dev/null || true
            fi
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build Hex Game
        run: |
          npm ci
          npm run build

      - name: Install and build Story Architecture Studio
        if: hashFiles('story-architecture-studio/package.json') != ''
        working-directory: story-architecture-studio
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
        env:
          BASE_PATH: /TestGame/studio/

      - name: Combine site artifacts
        if: hashFiles('story-architecture-studio/package.json') != ''
        run: |
          mkdir -p dist/studio
          cp -r story-architecture-studio/dist/* dist/studio/

      - name: Install and build Sound Studio
        if: hashFiles('sound-studio/package.json') != ''
        working-directory: sound-studio
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
        env:
          BASE_PATH: /TestGame/sound/

      - name: Combine Sound Studio artifacts
        if: hashFiles('sound-studio/package.json') != ''
        run: |
          mkdir -p dist/sound
          cp -r sound-studio/dist/* dist/sound/

      - name: Install and build Wind Composer Web (static PWA)
        if: hashFiles('wind-composer-web/package.json') != ''
        working-directory: wind-composer-web
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
        env:
          BASE_PATH: /TestGame/wind-composer/

      - name: Combine Wind Composer Web artifacts
        if: hashFiles('wind-composer-web/package.json') != ''
        run: |
          mkdir -p dist/wind-composer
          cp -r wind-composer-web/dist/* dist/wind-composer/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: pages-publish-${{ github.ref }}
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Unblock wedged Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "Clearing wedged github-pages deployments before publish..."
          mapfile -t dep_ids < <(
            gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=30" --jq '.[].id'
          )
          for dep_id in "${dep_ids[@]}"; do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${dep_id}/statuses" --jq '.[0].state' 2>/dev/null)
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${dep_id}" --jq '.sha' 2>/dev/null)
            if [ "$sha" = "${{ github.sha }}" ]; then
              continue
            fi
            if [ "$state" = "in_progress" ] || [ "$state" = "queued" ] || [ "$state" = "waiting" ]; then
              echo "Unblocking deployment ${dep_id} (${sha:0:7}, was ${state})"
              gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${sha}/cancel" >/dev/null 2>&1 || true
              gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments/${dep_id}/statuses" \
                -f state=inactive \
                -f description="Cleared wedged Pages deployment" >/dev/null 2>&1 || true
            fi
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
