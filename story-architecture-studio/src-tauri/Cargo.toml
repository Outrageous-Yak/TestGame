[package]
name = "story-architecture-studio"
version = "0.5.0"
description = "Story Architecture Studio desktop shell"
authors = ["Story Architecture Studio"]
edition = "2021"

[lib]
name = "story_architecture_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
